[workspace]
members           = [
    "arduino",
    "orchestrator",
    "physics"
]
# aruco-gen is the superseded DICT_4X4_50 generator, kept for reference
# only (AGENTS.md); excluded so it builds standalone and stays untouched.
exclude           = [
    "aruco"
]
resolver          = "3"

[workspace.package]
version           = "0.1.0"
edition           = "2024"

[workspace.dependencies]
anyhow            = { version = "1.0.104" }
clap              = { version = "4.6.7", features = ["derive"] }
futures-util      = { version = "0.3.34" }
arduino           = { path = "arduino" }
physics           = { path = "physics" }
serde             = { version = "1.0.229", features = ["derive"] }
# float_roundtrip: parse every float to the exact double its text names, so
# the pool the Orin writes reaches states.csv bit for bit.
serde_json        = { version = "1.0.154", features = ["float_roundtrip"] }
tokio             = { version = "1.54.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30.0" }
toml              = { version = "1.1.8" }

[workspace.lints.clippy]
unwrap_used       = "deny"
expect_used       = "deny"
panic             = "deny"

[workspace.lints.rust]
unused_must_use   = "deny"
