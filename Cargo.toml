[workspace]
members           = [
    "firmware",
    "object-detection",
    "orchestrator",
    "physics"
]
# aruco-gen is the superseded DICT_4X4_50 generator, kept for reference
# only (AGENTS.md); excluded so it builds standalone and stays untouched.
exclude           = [
    "aruco"
]
resolver          = "3"

[workspace.package]
version           = "0.1.0"
edition           = "2024"

[workspace.dependencies]
anyhow            = { version = "1.0.104" }
clap              = { version = "4.6.7", features = ["derive"] }
futures-util      = { version = "0.3.34" }
# JPEG decoder only (detector-plan.md R2).
image             = { version = "0.25.10", default-features = false, features = ["jpeg"] }
firmware          = { path = "firmware" }
object-detection  = { path = "object-detection" }
physics           = { path = "physics" }
serde             = { version = "1.0.229", features = ["derive"] }
serde_json        = { version = "1.0.154" }
tokio             = { version = "1.54.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30.0" }
toml              = { version = "1.1.8" }
# Only for its multithread-mm feature: tract-onnx runs on one thread
# without it.
tract-linalg      = { version = "0.23.9", features = ["multithread-mm"] }
# Pure-Rust ONNX inference: builds for the Pi 5 with nothing to install
# there (detector-plan.md R1).
tract-onnx        = { version = "0.23.9" }

[workspace.lints.clippy]
unwrap_used       = "deny"
expect_used       = "deny"
panic             = "deny"

[workspace.lints.rust]
unused_must_use   = "deny"
