# The bench station's settings (src/main.rs): the Pi beside the rig
# (bench-station-plan.md). Read at start-up: restart the service after a
# change. Relative paths resolve against this file's folder.
#
# Rates are pulses/s, the unit the Arduino drives. At the rig's 15 µm a
# pulse (96 mm per turn ÷ (200 × 32), trainer/settings.toml [drive]),
# 1,000 pulses/s is 15 mm/s.

[station]
# Where the page listens. 0.0.0.0 answers on every network the Pi is on;
# the router must not forward this port, because POST /flash lets anyone
# who reaches it reflash the rig (the plan's *The Pi's service*).
listen = "0.0.0.0:8080"

# The folder for the log files (one per opening of the serial line) and
# the experiment's results files (one per run).
log_dir = "logs"

# How many of the newest log lines the page shows.
page_log_lines = 300

# The board's own page, where the rig is run (the old WiFi firmware,
# calibrate.toml [wifi]); the Pi's page links to it.
board_page = "http://192.168.0.220/"

[serial]
# The Arduino's USB serial port. /dev/serial/by-id/... names one board
# and survives replugging into another socket; /dev/ttyACM0 is whichever
# board enumerated first.
port = "/dev/ttyACM0"

# The line's baud. Any rate but 1,200 and 2,400 only sets the speed; the
# bridge resets the RA4M1 at those two (UNOR4USBBridge.ino,
# usbEventCallback), so opening at 115,200 never resets the board.
baud = 115200

# The longest a command may wait for its reply, ms. The slowest is a seek
# across the whole rail, which the Arduino itself ends after its
# seek_timeout_ms (34,000, calibrate.toml); this is the Pi's backstop for
# a board that has stopped answering.
reply_timeout_ms = 60000

# The wait between attempts to open the port while it is missing, ms.
reopen_ms = 1000

[flash]
# The program that uploads a .bin, and the board's FQBN (calibrate's
# README, *Build and upload*).
arduino_cli = "arduino-cli"
fqbn = "arduino:renesas_uno:unor4wifi"

# Where an uploaded .bin is kept while it is flashed.
work_dir = "flash"

# How long after an upload to wait for the port to come back, ms: the
# board re-enumerates as it leaves its bootloader.
port_wait_ms = 15000

[rig]
# The slow moves: jogs, the experiment's moves to the centre and away
# from the reference switch, pulses/s. The same value as calibrate.toml's
# seek_speed, which the Arduino uses for its seeks.
seek_speed = 2000

# The Arduino's ramp acceleration, pulses/s², as built into its firmware
# (calibrate.toml's accel). The Pi uses it only to work out how far a
# trial's ramps carry the cart, so it must match the firmware's value.
accel = 200000

# One jog from the page, pulses; a jog stops early at either switch.
# 333 pulses is 5 mm.
jog_pulses = 333

# The pause between two moves, ms, so the cart is at rest when the
# direction changes (calibrate.toml's settle_ms).
settle_ms = 250

[experiment]
# The jump-limit experiment (jump-limit-experiment.md), moved from
# calibrate.toml's [experiment]. Each value names the brief's section.

# The rig's conditions, copied into the report (section 6). Nothing
# measures them: keep this true to the rig.
conditions = "24 V supply; DM542 3.76 A peak, 2.69 A RMS (SW1-3 on, off, off); 1/32; pole mounted"

# The top pulse rate the trials stay inside, pulses/s: the rate training
# will clamp to (section 2).
trial_top = 48000

# Δt, the gap between commands, ms: the loop's longest, the hardest
# (section 3).
trial_dt_ms = 16

# The first change rate tried, pulses/s² (section 7): a tenth of the
# ceiling, 6,200,000 pulses/s² (calibrate.toml explains the ceiling).
j_start = 620000

# How much j rises after a j passes, % (section 7: about a quarter).
j_growth_percent = 25

# Trials at each j; a kind's limit is the largest j where none lost a
# step (section 5, step 4).
trials_per_j = 10

# Slow returns to the reference switch for the noise floor (section 5,
# step 1), each from this many pulses away. 2,000 pulses is 30 mm.
noise_repeats = 10
noise_away_pulses = 2000

# The hold at c_a before the jump, ms (a choice), and at c_b after it, ms
# (section 5, step 2c: 0.1 s).
steady_ms = 200
hold_ms = 100

# The room a trial's plan must leave at each end of the rail, pulses.
# 3,000 pulses is 45 mm. A choice, from no source.
end_margin_pulses = 3000

# How many times one run may re-home and carry on after the Arduino
# resets or its port drops mid-run. Each repeats the step that was cut
# short.
resumes = 3
