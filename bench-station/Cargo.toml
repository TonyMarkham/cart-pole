[package]
name              = "bench-station"
version           = "0.1.0"
edition           = "2024"
description       = "The Raspberry Pi beside the rig: the web page, the jump-limit experiment, the log and flashing, talking to the Arduino over USB serial (bench-station-plan.md)"
publish           = false

# A workspace of its own: the Pi builds this crate alone, from a copy of
# this folder, without the rest of the repo's workspace.
[workspace]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "process", "fs", "io-util"] }
tokio-serial = { version = "5.5.0", default-features = false }
tokio-util = { version = "0.7.20", features = ["codec"] }
toml = "1.1.8"

[lints.clippy]
unwrap_used       = "deny"
expect_used       = "deny"
panic             = "deny"

[lints.rust]
unused_must_use   = "deny"
