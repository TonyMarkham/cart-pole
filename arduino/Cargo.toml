[package]
name              = "arduino"
version           = { workspace = true }
edition           = { workspace = true }
description       = "The cart's Arduino firmware, one source for the rig and the sim loop: the Orin's 4-byte pulse-rate command in, the DRV8825's DIR and STEP rate out"

[features]
# The sim loop's build (synthetic-arduino-plan.md): runs on the PC with std and
# returns the DRV8825 signals, DIR and STEP rate, which the orchestrator
# turns into the velocity actuator's ctrl, in m/s. Without it the crate is no_std, the shape the board's
# build takes.
synthetic         = []

[lints]
workspace = true
