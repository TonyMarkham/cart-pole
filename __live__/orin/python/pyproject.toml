[project]
name = "live-orin"
version = "0.1.0"
description = "The real Orin's Python: takes a picture with the Global Shutter camera and pushes it to the viewer"
# 3.10 is the Orin's system Python, the one JetPack's TensorRT is installed
# for (/usr/lib/python3.10/dist-packages, checked on robo-orin 2026-10-31).
requires-python = ">=3.10"
dependencies = [
    # Python reads toml by itself only from 3.11 (tomllib).
    "tomli>=2; python_version < '3.11'",
]
