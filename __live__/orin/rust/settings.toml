# The webserver's settings. Read once when it starts, from the folder it runs
# in, so run it from this folder (its README, deployment step 9).

[arduino]
# Where the rig's Arduino listens, for the /arduino page. The board prints its
# address on its USB serial port after it joins the WiFi; on this network it
# has been 192.168.0.220. The port must match the firmware's [wifi] udp_port.
address = "192.168.0.220"
port = 4210

# How long to wait for the board's answer before the page says it gave none,
# ms. A datagram can be lost on WiFi, and nothing resends it: the next reading
# simply asks again. Chosen, not measured.
timeout_ms = 1000

# The pause between the page's readings, ms. A reading happens only while the
# page is open; between readings the board sleeps.
poll_ms = 1000

# How long to wait for the board's answer to a move, ms. The board answers only
# once the cart has stopped, and a seek stops by itself at the firmware's
# seek_timeout_ms, 34,000, so this must be longer than that. If it runs out, the
# answer was lost or the board is off, and the cart may still have moved.
move_timeout_ms = 40000

# The most pulses a move to the centre can take, for working out how long to wait
# when the page asks for a slow one: half the rail, measured at 29,910 on
# 2026-11-01, rounded up. Only the wait uses it; the board measures its own span.
half_span_pulses = 30000

# How many times to send the board a Stop, and the pause between them, ms. A
# datagram can be lost on WiFi and nothing resends it, so one press sends several.
# The first to arrive ends the move, and the board ignores the rest. Chosen, not
# measured.
stop_sends = 3
stop_gap_ms = 50
