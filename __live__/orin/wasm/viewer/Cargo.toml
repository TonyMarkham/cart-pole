[package]
name           = "viewer"
version        = { workspace = true }
edition        = { workspace = true }
description    = "The viewer page, in the browser: shows each image the webserver pushes over its WebSocket, and asks for a fresh camera frame with its Refresh button"
publish        = false

[dependencies]
error-location = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
wasm-bindgen   = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys        = {
                   workspace = true,
                   features = ["HtmlButtonElement"]
}

[lints]
workspace      = true
