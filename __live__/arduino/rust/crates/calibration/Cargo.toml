[package]
name              = "calibration"
version           = { workspace = true }
edition           = { workspace = true }
description       = "The live calibration's firmware for the rig's Arduino UNO R4 WiFi. For now it sleeps until a UDP datagram asks for its pins' levels; it moves nothing"
publish           = false

[dependencies]
# `uart-irq`: the interrupt that wakes the board when the WiFi chip sends it
# a byte.
unor4-hal         = { workspace = true, features = ["uart-irq"] }
cortex-m          = { workspace = true }
cortex-m-rt       = { workspace = true }
embedded-hal      = { workspace = true }
panic-halt        = { workspace = true }
ra4m1             = { workspace = true }

[build-dependencies]
anyhow            = { workspace = true }
toml              = { workspace = true }

[lints]
workspace = true
