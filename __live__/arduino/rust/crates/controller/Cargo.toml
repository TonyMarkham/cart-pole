[package]
name              = "controller"
version           = { workspace = true }
edition           = { workspace = true }
description       = "The rig's Arduino UNO R4 WiFi firmware that runs the cart under the Orin's commands. Built one slice at a time; the first is the board's state machine"
publish           = false
build             = "build/main.rs"

[dependencies]
cortex-m          = { workspace = true }
cortex-m-rt       = { workspace = true }
embedded-hal      = { workspace = true }
panic-halt        = { workspace = true }
ra4m1             = { workspace = true }
unor4-hal         = { workspace = true, features = ["uart-irq"] }

[build-dependencies]
anyhow            = { workspace = true }
toml              = { workspace = true }

[lints]
workspace = true
