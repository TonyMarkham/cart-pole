[package]
name              = "calibrate"
version           = "0.1.0"
edition           = "2024"
description       = "Centres the cart on the rig: seeks the left limit switch, then the right, counting every pulse between them, and drives back half that count"
publish           = false

# A workspace of its own: this crate builds only for the board
# (thumbv7em-none-eabihf, .cargo/config.toml here), while the root
# workspace builds for the PC and excludes it.
[workspace]

[dependencies]
# The user's HAL, from the sibling checkout D:\git\unor4-hal (the path
# form its README gives until it is published); the crate sits in that
# repo's crates/ folder.
unor4-hal         = { path = "../../unor4-hal/crates/unor4-hal" }
cortex-m          = { version = "0.7.9" }
# `device`: unor4-hal supplies the interrupt vector table (its README).
cortex-m-rt       = { version = "0.7.7", features = ["set-vtor", "device"] }
embedded-hal      = { version = "1.0.0" }
panic-halt        = { version = "1.0.0" }
ra4m1             = { version = "0.2.0" }

[build-dependencies]
anyhow            = { version = "1.0.104" }
toml              = { version = "1.1.8" }

[profile.release]
opt-level         = 3    # the pulse loop's overhead slows the fast move
lto               = true
codegen-units     = 1
debug             = true # keeps cargo size and backtraces readable

[lints.clippy]
unwrap_used       = "deny"
expect_used       = "deny"
panic             = "deny"

[lints.rust]
unused_must_use   = "deny"
