<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1225" width="1400" height="1225" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <!-- The wiring of control-design.md: supply, rocker, Arduino UNO R4 WiFi,
       the three PNP stages, the DM542, motor, and the two limit switches. -->
  <rect width="1400" height="1225" fill="#ffffff"/>
  <text x="60" y="32" font-size="18" font-weight="bold" fill="#111">Cart-pole drive wiring</text>
  <text x="290" y="32" font-size="12" fill="#555">from control-design.md</text>

  <defs>
    <style>
      .w { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .v24 { stroke: #d62728; }
      .gnd { stroke: #222222; }
      .v5 { stroke: #ef8a00; }
      .en { stroke: #7b3fb5; }
      .step { stroke: #1f6fb4; }
      .dir { stroke: #12a3b8; }
      .sw { stroke: #2e8b57; }
      .dot { stroke: none; }
      .pin { fill: #555; }
      .lbl { fill: #222; }
      .small { font-size: 10.5px; fill: #444; }
      .wl { font-size: 11px; font-weight: bold; }
      .part { fill: #fff; stroke: #111; stroke-width: 2; }
      .sym { fill: none; stroke: #111; stroke-width: 2; stroke-linecap: round; }
      .earth { stroke: #222; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- ===================== 24 V supply ===================== -->
  <rect x="60" y="50" width="200" height="110" rx="6" fill="#fdf1f0" stroke="#b71c1c" stroke-width="2"/>
  <text x="160" y="96" text-anchor="middle" font-size="14" font-weight="bold">24 V DC supply</text>
  <text x="160" y="116" text-anchor="middle" class="small">DM542 20–50 V; VIN 6–24 V</text>
  <text x="250" y="89" text-anchor="end" font-size="14" font-weight="bold">−</text>
  <text x="250" y="140" text-anchor="end" font-size="14" font-weight="bold">+</text>
  <rect x="256" y="81" width="8" height="8" class="pin"/>
  <rect x="256" y="131" width="8" height="8" class="pin"/>

  <!-- GND from the supply: to the DM542's GND -->
  <path class="w gnd" d="M260 85 H1230 V420 H1150"/>
  <text x="700" y="78" class="wl" fill="#222">GND</text>
  <!-- 24 V from the supply: to +V -->
  <path class="w v24" d="M260 135 H1200 V380 H1150"/>
  <text x="700" y="128" class="wl" fill="#d62728">+24 V</text>

  <!-- ===================== Rocker on VIN ===================== -->
  <circle cx="320" cy="135" r="4.5" fill="#d62728" class="dot"/>
  <path class="w v24" d="M320 135 V200"/>
  <circle cx="320" cy="204" r="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <circle cx="320" cy="256" r="4" fill="#fff" stroke="#111" stroke-width="2"/>
  <line x1="320" y1="252" x2="346" y2="212" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <path class="w v24" d="M320 260 V400 H380"/>
  <text x="352" y="222" font-weight="bold">Rocker switch (SPST)</text>
  <text x="352" y="238" class="small">switches the Arduino's power only;</text>
  <text x="352" y="251" class="small">off: the DM542 stays on, holding</text>
  <text x="330" y="394" class="wl" fill="#d62728">VIN</text>

  <!-- Arduino GND from the supply; hops over the +24 V line -->
  <circle cx="290" cy="85" r="4.5" fill="#222" class="dot"/>
  <path class="w gnd" d="M290 85 V127 A8 8 0 0 0 290 143 V450 H380"/>

  <!-- ===================== Arduino UNO R4 WiFi ===================== -->
  <rect x="380" y="330" width="300" height="430" rx="8" fill="#e5f3f3" stroke="#00838f" stroke-width="2.5"/>
  <text x="530" y="480" text-anchor="middle" font-size="15" font-weight="bold">Arduino UNO R4 WiFi</text>
  <text x="530" y="500" text-anchor="middle" class="small">USB-C: upload and serial monitor</text>
  <text x="530" y="514" text-anchor="middle" class="small">(USB power bypasses the rocker)</text>
  <!-- pins -->
  <rect x="376" y="396" width="8" height="8" class="pin"/>
  <text x="390" y="404" class="lbl">VIN</text>
  <rect x="376" y="446" width="8" height="8" class="pin"/>
  <text x="390" y="454" class="lbl">GND</text>
  <rect x="676" y="356" width="8" height="8" class="pin"/>
  <text x="670" y="364" text-anchor="end" class="lbl">5V</text>
  <rect x="676" y="396" width="8" height="8" class="pin"/>
  <text x="670" y="404" text-anchor="end" class="lbl">D4</text>
  <rect x="676" y="516" width="8" height="8" class="pin"/>
  <text x="670" y="524" text-anchor="end" class="lbl">D5</text>
  <rect x="676" y="636" width="8" height="8" class="pin"/>
  <text x="670" y="644" text-anchor="end" class="lbl">D6</text>
  <rect x="416" y="756" width="8" height="8" class="pin"/>
  <text x="420" y="748" text-anchor="middle" class="lbl">D2</text>
  <rect x="496" y="756" width="8" height="8" class="pin"/>
  <text x="500" y="748" text-anchor="middle" class="lbl">GND</text>
  <rect x="576" y="756" width="8" height="8" class="pin"/>
  <text x="580" y="748" text-anchor="middle" class="lbl">D3</text>

  <!-- ===================== DM542 ===================== -->
  <rect x="920" y="340" width="230" height="405" rx="6" fill="#efeaf8" stroke="#5e35b1" stroke-width="2.5"/>
  <text x="930" y="358" class="small">P1</text>
  <text x="1140" y="358" text-anchor="end" class="small">P2</text>
  <text x="1035" y="452" text-anchor="middle" font-size="15" font-weight="bold">DM542</text>
  <text x="1035" y="470" text-anchor="middle" class="small">stepper driver</text>
  <text x="1035" y="500" text-anchor="middle" class="small">SW1–3: on off off</text>
  <text x="1035" y="514" text-anchor="middle" class="small">3.76 A peak</text>
  <text x="1035" y="534" text-anchor="middle" class="small">SW4: on</text>
  <text x="1035" y="554" text-anchor="middle" class="small">SW5–8: off on off on</text>
  <text x="1035" y="568" text-anchor="middle" class="small">6400 pulses/rev</text>
  <!-- P1, the command inputs -->
  <g class="pin">
    <rect x="916" y="436" width="8" height="8"/><rect x="916" y="476" width="8" height="8"/>
    <rect x="916" y="556" width="8" height="8"/><rect x="916" y="596" width="8" height="8"/>
    <rect x="916" y="676" width="8" height="8"/><rect x="916" y="716" width="8" height="8"/>
  </g>
  <text x="930" y="444" class="lbl">PUL+</text>
  <text x="930" y="484" class="lbl">PUL−</text>
  <text x="930" y="564" class="lbl">DIR+</text>
  <text x="930" y="604" class="lbl">DIR−</text>
  <text x="930" y="684" class="lbl">ENA+</text>
  <text x="930" y="724" class="lbl">ENA−</text>
  <!-- P2, power and motor -->
  <g class="pin">
    <rect x="1146" y="376" width="8" height="8"/><rect x="1146" y="416" width="8" height="8"/>
    <rect x="1146" y="476" width="8" height="8"/><rect x="1146" y="516" width="8" height="8"/>
    <rect x="1146" y="556" width="8" height="8"/><rect x="1146" y="596" width="8" height="8"/>
  </g>
  <text x="1140" y="384" text-anchor="end" class="lbl">+V</text>
  <text x="1140" y="424" text-anchor="end" class="lbl">GND</text>
  <text x="1140" y="484" text-anchor="end" class="lbl">A+</text>
  <text x="1140" y="524" text-anchor="end" class="lbl">A−</text>
  <text x="1140" y="564" text-anchor="end" class="lbl">B+</text>
  <text x="1140" y="604" text-anchor="end" class="lbl">B−</text>

  <!-- ===================== Q1: D4 to PUL+ ===================== -->
  <path class="w v5" d="M680 360 H790"/>
  <text x="712" y="353" class="wl" fill="#ef8a00">5V</text>
  <path class="w step" d="M680 400 H710"/>
  <rect x="710" y="393" width="50" height="14" class="part"/>
  <text x="735" y="422" text-anchor="middle" class="small">2 × 1 kΩ</text>
  <path class="w step" d="M760 400 H824"/>
  <circle cx="790" cy="400" r="4.5" fill="#1f6fb4" class="dot"/>
  <path class="w step" d="M790 400 V392"/>
  <rect x="784" y="366" width="12" height="26" class="part"/>
  <text x="778" y="384" text-anchor="end" class="small">10 kΩ</text>
  <path class="w v5" d="M790 366 V360 H842 V380"/>
  <circle cx="790" cy="360" r="4.5" fill="#ef8a00" class="dot"/>
  <circle cx="834" cy="400" r="20" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <line x1="824" y1="388" x2="824" y2="412" stroke="#111" stroke-width="3"/>
  <path class="sym" d="M842 380 V384 L824 395"/>
  <path d="M829 392 L833.7 384.4 L837.9 391.2 Z" fill="#111"/>
  <path class="sym" d="M824 405 L842 416 V420"/>
  <text x="862" y="405" font-weight="bold">Q1</text>
  <path class="w step" d="M842 420 V440 H920"/>
  <text x="872" y="434" class="wl" fill="#1f6fb4">PUL+</text>
  <path class="w gnd" d="M920 480 H896 V488"/>
  <line x1="884" y1="488" x2="908" y2="488" class="earth"/>
  <line x1="888" y1="493" x2="904" y2="493" class="earth"/>
  <line x1="892" y1="498" x2="900" y2="498" class="earth"/>

  <!-- ===================== Q2: D5 to DIR+ ===================== -->
  <path class="w dir" d="M680 520 H710"/>
  <rect x="710" y="513" width="50" height="14" class="part"/>
  <text x="735" y="542" text-anchor="middle" class="small">2 × 1 kΩ</text>
  <path class="w dir" d="M760 520 H824"/>
  <circle cx="790" cy="520" r="4.5" fill="#12a3b8" class="dot"/>
  <path class="w dir" d="M790 520 V512"/>
  <rect x="784" y="486" width="12" height="26" class="part"/>
  <text x="778" y="504" text-anchor="end" class="small">10 kΩ</text>
  <path class="w v5" d="M790 486 V480 H842 V500"/>
  <path class="w v5" d="M790 480 V468"/>
  <path d="M782 468 L790 456 L798 468 Z" fill="#ef8a00"/>
  <text x="790" y="450" text-anchor="middle" class="wl" fill="#ef8a00">5V</text>
  <circle cx="790" cy="480" r="4.5" fill="#ef8a00" class="dot"/>
  <circle cx="834" cy="520" r="20" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <line x1="824" y1="508" x2="824" y2="532" stroke="#111" stroke-width="3"/>
  <path class="sym" d="M842 500 V504 L824 515"/>
  <path d="M829 512 L833.7 504.4 L837.9 511.2 Z" fill="#111"/>
  <path class="sym" d="M824 525 L842 536 V540"/>
  <text x="862" y="525" font-weight="bold">Q2</text>
  <path class="w dir" d="M842 540 V560 H920"/>
  <text x="872" y="554" class="wl" fill="#12a3b8">DIR+</text>
  <path class="w gnd" d="M920 600 H896 V608"/>
  <line x1="884" y1="608" x2="908" y2="608" class="earth"/>
  <line x1="888" y1="613" x2="904" y2="613" class="earth"/>
  <line x1="892" y1="618" x2="900" y2="618" class="earth"/>

  <!-- ===================== Q3: D6 to ENA+ ===================== -->
  <path class="w en" d="M680 640 H710"/>
  <rect x="710" y="633" width="50" height="14" class="part"/>
  <text x="735" y="662" text-anchor="middle" class="small">2 × 1 kΩ</text>
  <path class="w en" d="M760 640 H824"/>
  <circle cx="790" cy="640" r="4.5" fill="#7b3fb5" class="dot"/>
  <path class="w en" d="M790 640 V632"/>
  <rect x="784" y="606" width="12" height="26" class="part"/>
  <text x="778" y="624" text-anchor="end" class="small">10 kΩ</text>
  <path class="w v5" d="M790 606 V600 H842 V620"/>
  <path class="w v5" d="M790 600 V588"/>
  <path d="M782 588 L790 576 L798 588 Z" fill="#ef8a00"/>
  <text x="790" y="570" text-anchor="middle" class="wl" fill="#ef8a00">5V</text>
  <circle cx="790" cy="600" r="4.5" fill="#ef8a00" class="dot"/>
  <circle cx="834" cy="640" r="20" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <line x1="824" y1="628" x2="824" y2="652" stroke="#111" stroke-width="3"/>
  <path class="sym" d="M842 620 V624 L824 635"/>
  <path d="M829 632 L833.7 624.4 L837.9 631.2 Z" fill="#111"/>
  <path class="sym" d="M824 645 L842 656 V660"/>
  <text x="862" y="645" font-weight="bold">Q3</text>
  <path class="w en" d="M842 660 V680 H920"/>
  <text x="872" y="674" class="wl" fill="#7b3fb5">ENA+</text>
  <path class="w gnd" d="M920 720 H896 V728"/>
  <line x1="884" y1="728" x2="908" y2="728" class="earth"/>
  <line x1="888" y1="733" x2="904" y2="733" class="earth"/>
  <line x1="892" y1="738" x2="900" y2="738" class="earth"/>

  <!-- ===================== Motor ===================== -->
  <path class="w" stroke="#111111" d="M1150 480 H1260"/>
  <path class="w" stroke="#2e7d32" d="M1150 520 H1260"/>
  <path class="w" stroke="#d62728" d="M1150 560 H1260"/>
  <path class="w" stroke="#1565c0" d="M1150 600 H1260"/>
  <text x="1205" y="474" text-anchor="middle" class="small">black, A+</text>
  <text x="1205" y="514" text-anchor="middle" class="small">green, A−</text>
  <text x="1205" y="554" text-anchor="middle" class="small">red, B+</text>
  <text x="1205" y="594" text-anchor="middle" class="small">blue, B−</text>
  <rect x="1260" y="455" width="125" height="170" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2.5"/>
  <circle cx="1322" cy="500" r="22" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
  <circle cx="1322" cy="500" r="4" fill="#455a64"/>
  <text x="1322" y="548" text-anchor="middle" font-weight="bold">Stepper motor</text>
  <text x="1322" y="564" text-anchor="middle" class="small">23HS32-4004S</text>
  <text x="1322" y="584" text-anchor="middle" class="small">coil A: black, green</text>
  <text x="1322" y="598" text-anchor="middle" class="small">coil B: red, blue</text>

  <!-- ===================== Left limit switch (D2) ===================== -->
  <path class="w sw" d="M420 760 V840 H170"/>
  <text x="330" y="833" class="wl" fill="#2e8b57">D2</text>
  <rect x="60" y="820" width="110" height="80" rx="4" fill="#f1f8f1" stroke="#2e7d32" stroke-width="2"/>
  <line x1="66" y1="820" x2="160" y2="806" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
  <text x="115" y="796" text-anchor="middle" font-weight="bold">Left limit switch</text>
  <text x="70" y="870" class="small">cart presses</text>
  <text x="70" y="883" class="small">the lever</text>
  <rect x="166" y="836" width="8" height="8" class="pin"/>
  <rect x="166" y="856" width="8" height="8" class="pin"/>
  <rect x="166" y="876" width="8" height="8" class="pin"/>
  <text x="161" y="844" text-anchor="end" class="lbl">NC</text>
  <text x="161" y="864" text-anchor="end" class="small">NO</text>
  <text x="161" y="884" text-anchor="end" class="lbl">C</text>
  <path class="w gnd" d="M170 880 H200 V970"/>

  <!-- ===================== Right limit switch (D3) ===================== -->
  <path class="w sw" d="M580 760 V840 H830"/>
  <text x="650" y="833" class="wl" fill="#2e8b57">D3</text>
  <rect x="830" y="820" width="110" height="80" rx="4" fill="#f1f8f1" stroke="#2e7d32" stroke-width="2"/>
  <line x1="934" y1="820" x2="840" y2="806" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/>
  <text x="885" y="796" text-anchor="middle" font-weight="bold">Right limit switch</text>
  <text x="878" y="870" class="small">cart presses</text>
  <text x="878" y="883" class="small">the lever</text>
  <rect x="826" y="836" width="8" height="8" class="pin"/>
  <rect x="826" y="856" width="8" height="8" class="pin"/>
  <rect x="826" y="876" width="8" height="8" class="pin"/>
  <text x="839" y="844" class="lbl">NC</text>
  <text x="839" y="864" class="small">NO</text>
  <text x="839" y="884" class="lbl">C</text>
  <path class="w gnd" d="M830 880 H800 V970"/>

  <!-- the switches' GND, from the Arduino's bottom GND pin -->
  <path class="w gnd" d="M500 760 V970"/>
  <path class="w gnd" d="M200 970 H800"/>
  <circle cx="500" cy="970" r="4.5" fill="#222" class="dot"/>
  <text x="360" y="990" class="wl" fill="#222">GND</text>

  <!-- ===================== Legend ===================== -->
  <rect x="990" y="765" width="395" height="445" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
  <text x="1006" y="789" font-weight="bold" font-size="13">Key</text>
  <path class="w v24" d="M1006 811 H1046"/><text x="1056" y="815">+24 V supply</text>
  <path class="w gnd" d="M1006 833 H1046"/><text x="1056" y="837">GND, all joined</text>
  <path class="w v5" d="M1006 855 H1046"/><text x="1056" y="859">5 V from the Arduino's 5V pin</text>
  <path d="M1018 883 L1026 871 L1034 883 Z" fill="#ef8a00"/>
  <text x="1056" y="881">5V flag: wire it to that same pin</text>
  <path class="w gnd" d="M1026 893 V899"/>
  <line x1="1014" y1="899" x2="1038" y2="899" class="earth"/>
  <line x1="1018" y1="904" x2="1034" y2="904" class="earth"/>
  <line x1="1022" y1="909" x2="1030" y2="909" class="earth"/>
  <text x="1056" y="905">GND flag: wire it to the Arduino's GND</text>
  <circle cx="1026" cy="925" r="4.5" fill="#222"/><text x="1056" y="929">dot: wires joined</text>
  <path class="w gnd" d="M1006 947 H1018 A8 8 0 0 1 1034 947 H1046"/>
  <text x="1056" y="951">hop: crosses, not joined</text>
  <text x="1006" y="975" class="small">Q1–Q3: S8550 (PNP). Pin low lights its input. The leg</text>
  <text x="1006" y="989" class="small">order varies by maker: find the base with a meter first.</text>
  <text x="1006" y="1007" class="small">Switches use the NC contact: pressed, or a broken wire,</text>
  <text x="1006" y="1021" class="small">reads high, on the board's own pull-ups. NO is not connected.</text>
  <text x="1006" y="1039" class="small">Never plug or unplug the motor while the DM542 is powered.</text>
  <text x="1006" y="1055" class="small">First power-up: flip SW4 on-off-on within 1 s (auto-tuning).</text>
  <text x="1006" y="1069" class="small">No fault line: the DM542 only blinks its red LED. D8 unused.</text>

  <!-- resistor colour bands: 4-band (5 %) and 5-band (1 %) codes -->
  <text x="1006" y="1093" font-weight="bold">Resistor colour bands</text>
  <text x="1006" y="1107" class="small">Read from the end away from the gap; the last band is the tolerance.</text>
  <g>
    <line x1="1004" y1="1124" x2="1052" y2="1124" stroke="#777" stroke-width="2"/>
    <rect x="1010" y="1117" width="36" height="14" rx="4" fill="#e8d5a8" stroke="#8d7b55"/>
    <rect x="1014" y="1117" width="4" height="14" fill="#795548"/>
    <rect x="1020" y="1117" width="4" height="14" fill="#111"/>
    <rect x="1026" y="1117" width="4" height="14" fill="#d32f2f"/>
    <rect x="1038" y="1117" width="4" height="14" fill="#c9a227"/>
    <text x="1060" y="1128">1 kΩ, 4-band: brown, black, red, gold</text>
  </g>
  <g>
    <line x1="1004" y1="1146" x2="1052" y2="1146" stroke="#777" stroke-width="2"/>
    <rect x="1010" y="1139" width="36" height="14" rx="4" fill="#e8d5a8" stroke="#8d7b55"/>
    <rect x="1013" y="1139" width="4" height="14" fill="#795548"/>
    <rect x="1019" y="1139" width="4" height="14" fill="#111"/>
    <rect x="1025" y="1139" width="4" height="14" fill="#111"/>
    <rect x="1031" y="1139" width="4" height="14" fill="#795548"/>
    <rect x="1040" y="1139" width="4" height="14" fill="#795548"/>
    <text x="1060" y="1150">1 kΩ, 5-band: brown, black, black, brown, brown</text>
  </g>
  <g>
    <line x1="1004" y1="1168" x2="1052" y2="1168" stroke="#777" stroke-width="2"/>
    <rect x="1010" y="1161" width="36" height="14" rx="4" fill="#e8d5a8" stroke="#8d7b55"/>
    <rect x="1014" y="1161" width="4" height="14" fill="#795548"/>
    <rect x="1020" y="1161" width="4" height="14" fill="#111"/>
    <rect x="1026" y="1161" width="4" height="14" fill="#f57c00"/>
    <rect x="1038" y="1161" width="4" height="14" fill="#c9a227"/>
    <text x="1060" y="1172">10 kΩ, 4-band: brown, black, orange, gold</text>
  </g>
  <g>
    <line x1="1004" y1="1190" x2="1052" y2="1190" stroke="#777" stroke-width="2"/>
    <rect x="1010" y="1183" width="36" height="14" rx="4" fill="#e8d5a8" stroke="#8d7b55"/>
    <rect x="1013" y="1183" width="4" height="14" fill="#795548"/>
    <rect x="1019" y="1183" width="4" height="14" fill="#111"/>
    <rect x="1025" y="1183" width="4" height="14" fill="#111"/>
