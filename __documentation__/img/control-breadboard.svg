<text x="668" y="432" text-anchor="middle" font-size="12" fill="#333" font-weight="normal">5V</text>
<text x="400" y="440" text-anchor="middle" font-size="12" fill="#333" font-weight="normal">To the Arduino</text>
<text x="40" y="470" text-anchor="start" font-size="12" fill="#333" font-weight="bold">Breadboard layout for the three S8550 stages (__documentation__/control-design.md)</text>
<text x="40" y="487" text-anchor="start" font-size="12" fill="#333" font-weight="normal">S8550 (PNP): legs E, B, C from the left, flat face toward the centre gap (checked with a meter).</text>
<text x="40" y="504" text-anchor="start" font-size="12" fill="#333" font-weight="normal">10 kΩ (brown, black, black, red, brown): base column to the + rail. Path: D4 → 1k → 1k → base → 10k → 5 V.</text>
<text x="40" y="521" text-anchor="start" font-size="12" fill="#333" font-weight="normal">1 kΩ (brown, black, black, brown, brown): two in series, base column to the Arduino wire.</text>
<text x="40" y="538" text-anchor="start" font-size="12" fill="#333" font-weight="normal">+ rail to the Arduino's 5V pin (not VIN); − rail to its GND; the DM542's − inputs to the − rail.</text>
<text x="40" y="555" text-anchor="start" font-size="12" fill="#333" font-weight="normal">Limit switches go straight to the Arduino: NC to D2 or D3, C to GND.</text>
