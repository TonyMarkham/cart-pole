# The trainer's Gymnasium settings: one whole variant of the learning
# (rl-rewrite-plan.md, 3.3). The run itself - the orchestrator's command,
# the seed, the latency band, the MJCF - is in settings.toml, beside this
# file. Each plugin table is read and checked by its plugin alone
# (__synthetic__/trainer/python/src/plugins.py): changing a plugin's logic is a new file and its
# name here; tuning it is its table. The reward is the exception: its
# values are one table per factor, [reward.centered] and so on, which the
# scheme named in [reward] reads (user, 2026-10-29).

[env]
# Hz: the band of the orchestrator's seeded command rate. Each capture, it
# draws RND(min, max) and takes the next capture 1000 / that rate ms later,
# on the 2 ms grid: 34-50 ms apart at 20-30 Hz, 41.5 ms on average. Nothing
# happens in between (synthetic-loop-dia.md, Nothing happens between
# commands): no frame, no detection, no message, so the policy sees only the
# states it acts on, and each of its commands is held until the next. 1000 /
# command_rate_max must be at least [orchestrator] rnd_delay_max + one
# timestep: 58.8 Hz at most today. Why: at the old 12.57 ms, one command
# moved the critic's score less than the timing noise did
# (trainer-observations.md, Change 5). A run saved with other rates cannot
# resume. (user, 2026-10-30)
command_rate_min = 20.0
command_rate_max = 30.0

# Steps per episode before the time limit truncates it
# (synthetic-loop-dia.md, The time limit): a step is one command, so 460
# steps is about 19 s of simulated time at the mean gap of 41.5 ms. A
# truncation is not an end: SAC keeps valuing the state it stopped in.
max_episode_steps = 500

[observation]
# What the policy sees (__synthetic__/trainer/python/src/observations/). Never a site: the
# plugin is given the pool and the command history only. A run saved with
# another observation, or another table for it, cannot resume.
plugin = "pool_and_commands"

[observation.pool_and_commands]
# The pool's 30 floats, then the actions of the last past_commands
# commands, newest first, 0 before an episode's first
# (synthetic-loop-dia.md, The policy sees its last commands). NFQ2.0's
# real cart-pole needed at least 2 and used 6 (reward-research.md).
past_commands = 6

[action]
# The policy's action a in [-1, 1] to the command (__synthetic__/trainer/python/src/actions/).
# linear_rate: a x the top pulse rate (the run's values, from the MJCF and
# [drive]), rounded; it has no values.
plugin = "linear_rate"

[reward]
# The reward (__synthetic__/trainer/python/src/rewards/). dm_control_cartpole is
# DeepMind's cart-pole reward (__synthetic__/trainer/python/dm_control_reward.md):
#   r = upright x small_control x small_velocity x centered, in [0, 1],
#   every input MuJoCo's but the command: the pole's angle and speed from its
#   state, Cart and Cart Target from the sites. The command is c_t, as a
#   fraction of the top pulse rate.
# Each factor's values are its own table below; upright has none. Each value is
# DeepMind's own fixed number, from dm_control's cartpole.py, where it describes
# a 1 m pole on a 3.6 m rail: none has been tuned for this rig.
# A resume rescores every stored step through the scheme named here.
scheme = "dm_control_cartpole"

[reward.small_control]
# The fraction of the top pulse rate at which the score's part above the floor
# reaches 0 (dm_control_reward.md section 2): 1, a full-rate command.
margin = 1.0

# small_control's lowest value, at that command (section 2.2). 0.8: a full-rate
# command keeps four-fifths of the score.
floor = 0.8

[reward.small_velocity]
# rad/s: the pole's turning speed at which the bell falls to at_margin
# (dm_control_reward.md section 3.1.2).
margin = 5.0

# The bell's value at that speed: tolerance()'s default (section 3.1.3).
at_margin = 0.1

# small_velocity's lower limit, approached at high speed, never reached (section
# 3.2). 0.5: a step keeps at least half its score however fast the pole turns.
floor = 0.5

[reward.centered]
# metres from the middle of the rail: where the bell falls to at_margin
# (dm_control_reward.md section 4.1.2). 2: longer than DeepMind's rail, and much
# longer than this one, whose ends are about 0.44 m away, where this gives 0.947.
margin = 2.0

# The bell's value at that distance: tolerance()'s default.
at_margin = 0.1

# centered's lower limit, approached far out, never reached (section 4.2). 0.5: a
# step keeps at least half its score wherever the cart is.
floor = 0.5

[end]
# Which episode-end conditions are checked, each after the step's reward
# is paid (__synthetic__/trainer/python/src/endings/). A run saved with other end conditions,
# or other values for them, cannot resume: a rescore cannot move where
# stored episodes ended.
plugins = ["strike_gap"]

[end.strike_gap]
# b, metres: the episode ends when either strike-face gap (the cart's
# clearance to a base, from the sites) is under b (synthetic-loop-dia.md,
# The episode end). At least the cart top speed x the time from a check that
# passed to the stop taking effect: the longest gap between captures, then
# the longest latency, 52 + 16 = 68 ms at 20-30 Hz, 8-15 ms and a 2 ms
# timestep. 0.669 m/s x 68 ms = 0.0455 m; the plugin refuses less.
buffer = 0.046

[train]
# The training run (train.py): SAC learns until it has taken total_steps
# steps, every training instance's counting. Six instances took about
# 1 h 27 min for 500,000 (run 2, trainer-observations.md). A run that has
# reached total_steps resumes only once this is raised.
total_steps = 4_000_000

# Every save_every steps the run saves the model, its replay buffer and
# their manifest (latest.zip, latest_buffer.pkl, latest.json) and keeps a
# snapshot of the model and manifest (model_<steps>.zip / .json).
save_every = 10_000

# Where each training run gets its folder, runs/<date>_<time>/, relative
# to this file. __synthetic__/trainer/python/runs/ is gitignored.
runs_dir = "runs"

[sac]
# Stable-Baselines3's SAC (synthetic-loop-dia.md, The policy learns by
# SAC). Values are SB3's defaults except learning_starts, device and gamma.

# "cuda" (the 3090) or "cpu". Both measured the same step time.
device = "cuda"

# Steps of random actions before learning starts, to fill the replay
# buffer with varied motion: 10,000 is about 22 episodes of 460 steps.
learning_starts = 1_200

# The replay buffer: the most recent steps SAC learns from. Each step also
# keeps its inputs (91 floats), so 1,000,000 steps hold about 1.2 GB.
# !!!!! buffer_size = 1000000 // Original Value !!!!!
buffer_size = 2_000_000

# Steps per learning update, and Adam's step size.
batch_size = 256
# !!!!! learning_rate = 0.0003 // Original Value !!!!!
learning_rate = 0.0001

# The discount (synthetic-loop-dia.md, The discount): rewards about
# 1 / (1 - gamma) steps ahead still count, 152 steps at 0.9934, about 6.3 s
# at the mean gap of 41.5 ms: the same time ahead as 0.998 at the old 12.57
# ms. Read only by a new run: a resume keeps the saved model's.
gamma = 0.9934

# How fast the target critics follow the critics.
tau = 0.005

# One update (gradient_steps) after every step (train_freq). A step is one
# step of every training instance; gradient_steps = -1 (SB3: as many
# updates as samples) keeps one per sample.
train_freq = 1
gradient_steps = 1

# The policy's and critics' hidden layers.
net_arch = [256, 256]
