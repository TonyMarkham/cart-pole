# The workbench's Orin workspace: this folder is pushed to the Orin and built
# there, as __live__/orin/rust is, so nothing here may point outside it.
[workspace]
members         = [
                    "crates/camera-timing",
                    "crates/stage-timing",
]
resolver        = "3"

[workspace.package]
version         = "0.1.0"
edition         = "2024"

[workspace.dependencies]
anyhow          = { version = "1.0.104" }
clap            = {
                    version = "4.6.7",
                    features = ["derive"]
}
gpiocdev        = { version = "0.8.0" }
serde           = {
                    version = "1.0.229",
                    features = ["derive"]
}
serde_json      = { version = "1.0.154" }
toml            = { version = "1.1.8" }

[workspace.lints.clippy]
unwrap_used     = "deny"
expect_used     = "deny"
panic           = "deny"

[workspace.lints.rust]
unused_must_use = "deny"
