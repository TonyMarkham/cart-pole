# How the board runs the Orin's commands: the ramp each 2 ms tick follows, and
# the fastest it may go (real-loop-dia.md, *The command and the Arduino's Run*).

# The jump limit m, pulses/s²: each tick moves the sent rate towards the
# command by at most m × 2 ms, rounded down, 2,058 pulses/s. 15% below the
# 1,210,937 measured on the rig (jump-limit-results.md: the staircase, the
# lowest of the four kinds' limits, with the pole hanging): on 2026-11-07
# the swinging pole's load made the belt skip teeth at the measured value,
# up to 25 in one 30 s run, so the user lowered it by 10%, and then, the belt
# still skipping, by another 5% (user, 2026-11-07). It
# must equal the m the policy trained with, the trainer's [drive] jump_limit
# (__synthetic__/trainer/python/settings.toml): changed here alone, the cart
# ramps differently from training. The policy of 2026-11-01 trained at
# 1,210,937.
jump_limit = 900_000

# The top rate, pulses/s: every command is clamped to ± this. 44,600 is the
# rig's top rate on its 24 V supply (motor-spec.md, *The top pulse rate per
# supply*).
top_rate = 44_600