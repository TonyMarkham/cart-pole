[package]
name              = "bench-firmware"
version           = { workspace = true }
edition           = { workspace = true }
description       = "Test firmware for the bench UNO R4 WiFi: the controller's run loop, with D3 high while the processor is awake, for the R3 to time"
publish           = false
build             = "build/main.rs"

[dependencies]
cortex-m          = { workspace = true }
cortex-m-rt       = { workspace = true }
embedded-hal      = { workspace = true }
panic-halt        = { workspace = true }
ra4m1             = { workspace = true }
unor4-hal         = { workspace = true, features = ["uart-irq"] }

[build-dependencies]
anyhow            = { workspace = true }
toml              = { workspace = true }

[lints]
workspace = true
