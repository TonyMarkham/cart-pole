[package]
name              = "wifi-host"
version           = { workspace = true }
edition           = { workspace = true }
description       = "The PC side of the bench's WiFi test: synchronises the bench R4's clock to the PC's over USB, sends it random 3-byte datagrams over WiFi, and times each one's hop on the PC's clock"
publish           = false

[dependencies]
anyhow            = { workspace = true }
clap              = { workspace = true }
serde             = { workspace = true }
serialport        = { workspace = true }
toml              = { workspace = true }

[lints]
workspace = true
