[package]
name              = "object-detection"
version           = { workspace = true }
edition           = { workspace = true }
description       = "The virtual Pi's detector: runs the trained model on a frame JPEG and returns the 4-slot marker frame"

[features]
# Inference on a Coral USB Edge TPU through TFLite's C API (the Pi build):
# links libtensorflow-lite (Ubuntu's libtensorflow-lite-dev) and
# libedgetpu.so.1 (libedgetpu1-std). Without it, tract runs best.onnx.
edgetpu           = []

[dependencies]
anyhow            = { workspace = true }
image             = { workspace = true }
serde             = { workspace = true }
toml              = { workspace = true }
tract-linalg      = { workspace = true }
tract-onnx        = { workspace = true }

[lints]
workspace = true
